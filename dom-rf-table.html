<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>наш.дом.рф — Mariupol construction (full data)</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;font:13px system-ui,sans-serif;background:#0b0e13;color:#e7ecf3}
  header{position:sticky;top:0;background:#11151c;padding:12px 16px;border-bottom:1px solid #2a323f;z-index:5}
  h1{font-size:16px;margin:0 0 6px}
  #meta{color:#9aa6b6;font-size:12px}
  input{background:#1b2230;border:1px solid #2f3a4a;color:#e7ecf3;border-radius:6px;padding:6px 10px;width:280px;font-size:13px}
  .wrap{overflow:auto;max-height:calc(100vh - 70px)}
  table{border-collapse:collapse;width:100%;white-space:nowrap}
  th,td{padding:5px 9px;border-bottom:1px solid #202833;text-align:left;font-size:12px}
  th{position:sticky;top:0;background:#1b2230;cursor:pointer;user-select:none}
  th:hover{background:#242d3d}
  tr:hover td{background:#161b24}
  td.done{border-left:3px solid #35c46a}
  td.build{border-left:3px solid #f5a623}
  a{color:#4ea1ff}
  .no{color:#5a6472}
  .pill{padding:1px 6px;border-radius:9px;font-size:11px;font-weight:600;color:#0b0e13}
</style>
</head>
<body>
<header>
  <h1>наш.дом.рф — Mariupol construction</h1>
  <div id="meta">loading…</div>
  <input id="q" placeholder="filter (address, developer, name, INN…)"/>
</header>
<div class="wrap"><table id="t"><thead></thead><tbody></tbody></table></div>
<script>
const COLS=[
 ["objId","ID"],["nameObj","Name"],["objAddr","Address"],["siteStatus","Status"],
 ["devShortName","Developer"],["devInn","INN"],["devOgrn","OGRN"],["devDirector","Director"],
 ["generalContractor","Contractor"],["completion","Completion"],["floorMin","Fl.min"],["floorMax","Fl.max"],
 ["apartments","Flats"],["livingArea","Living m²"],["avgPrice","₽/m²"],["objClass","Class"],
 ["devLegalAddr","Legal addr"],["devPhone","Phone"],["devEmail","Email"],["rpdNum","Decl.№"],
 ["rpdPdfLink","PDF"],["hasDetail","Detail"]
];
let rows=[], sortKey="objId", asc=true;
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

fetch("sources/dom-rf/mariupol_detailed.geojson").then(r=>r.json()).then(gj=>{
  rows=gj.features.map(f=>f.properties);
  const n=rows.length, d=rows.filter(r=>r.hasDetail).length;
  document.getElementById("meta").textContent=`${n} buildings · ${d} with full detail · ${n-d} catalog-only`;
  document.querySelector("thead").innerHTML="<tr>"+COLS.map(c=>`<th data-k="${c[0]}">${c[1]}</th>`).join("")+"</tr>";
  document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;asc=(k===sortKey)?!asc:true;sortKey=k;render();});
  render();
});
function cell(r,k){
  const v=r[k];
  if(k==="rpdPdfLink") return v?`<a href="${v}" target="_blank">PDF</a>`:'<span class="no">—</span>';
  if(k==="devSite"||k==="rpdPdfLink") return v?`<a href="${v}" target="_blank">link</a>`:'';
  if(k==="hasDetail") return v?'✓':'<span class="no">catalog</span>';
  if(k==="siteStatus"){const c=r.objStatus===2?"#35c46a":"#f5a623";return `<span class="pill" style="background:${c}">${esc(v)}</span>`;}
  return v==null||v===""?'<span class="no">—</span>':esc(v);
}
function render(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  let r=rows.filter(x=>!q||COLS.some(c=>String(x[c[0]]??"").toLowerCase().includes(q)));
  r.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];
    if(typeof x==="number"&&typeof y==="number")return asc?x-y:y-x;
    x=String(x??"");y=String(y??"");return asc?x.localeCompare(y):y.localeCompare(x);});
  document.querySelector("tbody").innerHTML=r.map(row=>{
    const cls=row.objStatus===2?"done":"build";
    return "<tr>"+COLS.map((c,i)=>`<td class="${i===0?cls:''}">${cell(row,c[0])}</td>`).join("")+"</tr>";
  }).join("");
}
document.getElementById("q").addEventListener("input",render);
</script>
</body>
</html>
